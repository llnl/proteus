# Hubcast names each child pipeline's GitHub check after the pipeline name.
workflow:
  name: "${CI_MACHINE}-${PIPELINE_KIND}"

# We define the following GitLab pipeline variables:
variables:
# In some pipelines we create only one allocation shared among jobs in
# order to save time and resources. This allocation has to be uniquely
# named so that we are sure to retrieve it and avoid collisions.
  ALLOC_NAME: ${CI_PROJECT_NAME}_ci_${CI_PIPELINE_ID}
# Standalone Slurm jobs need a job-scoped unique name for cleanup.
  SLURM_JOB_NAME: ${CI_PROJECT_NAME}_ci_${CI_JOB_ID}
# Standalone Flux batch jobs need a job-scoped unique name for cleanup.
  FLUX_JOB_NAME: ${CI_PROJECT_NAME}_ci_${CI_JOB_ID}

# Matrix
# Time in minutes.
# Arguments for top level allocation
# Note: can be set to "OFF" to prevent allocation sharing.
  MATRIX_SHARED_ALLOC: "OFF"
# Arguments for job level allocation
  MATRIX_JOB_ALLOC: "--job-name=${SLURM_JOB_NAME} --account=asccasc --gpus=1 --nodes=1 --time=60 --partition=pdebug"
# Arguments for performance job allocation (dedicated allocation with no overlapping).
  MATRIX_PERF_ALLOC: "--account=asccasc --exclusive --time=60 --nodes=1"
# Add variables that should apply to all the jobs on a machine:
#  MATRIX_MY_VAR: "..."

# Tioga
# Arguments for top level allocation
# Note: can be set to "OFF" to prevent allocation sharing.
# OPTIONAL: "-o per-resource.count=2" allows to get 2 jobs running on each node.
  TIOGA_SHARED_ALLOC: "-B asccasc --queue=pci --exclusive --time-limit=1h --nodes=1 -o per-resource.count=4"
# Arguments for job level allocation
  TIOGA_JOB_ALLOC: "--job-name=${FLUX_JOB_NAME} -B asccasc --time-limit=1h --nodes=1 --begin-time=+5s"
# Arguments for performance job allocation (dedicated allocation with no overlapping).
  TIOGA_PERF_ALLOC: "-B asccasc --queue=pci --exclusive --time-limit=1h --nodes=1 --begin-time=+5s"
# Add variables that should apply to all the jobs on a machine:
#  TIOGA_MY_VAR: "..."

# Tuolumne
# Arguments for top level allocation
# Note: can be set to "OFF" to prevent allocation sharing.
# OPTIONAL: "-o per-resource.count=2" allows to get 2 jobs running on each node.
  TUOLUMNE_SHARED_ALLOC: "-B asccasc --queue=pci --exclusive --time-limit=1h --nodes=1 -o per-resource.count=4"
# Arguments for job level allocation
  TUOLUMNE_JOB_ALLOC: "--job-name=${FLUX_JOB_NAME} -B asccasc --time-limit=1h --nodes=1 --begin-time=+5s"
# Arguments for performance job allocation (dedicated allocation with no overlapping).
  TUOLUMNE_PERF_ALLOC: "-B asccasc --queue=pci --exclusive --time-limit=1h --nodes=1 --begin-time=+5s"
# Add variables that should apply to all the jobs on a machine:
#  TUOLUMNE_MY_VAR: "..."

# Configuration shared by build and test jobs specific to this project.
# Not all configuration can be shared. Here projects can fine tune the
# CI behavior.
# See Umpire for an example (export junit test reports).
.custom_job:
  variables:
    JOB_TEMPLATE_CANNOT_BE_EMPTY: "True"

# Remove only this job's clone; CI_BUILDS_DIR is shared with concurrent jobs.
.remove-builds-dir:
  after_script:
    - rm -rf ${CI_PROJECT_DIR}

.clean-flux-allocation:
  after_script:
    - |
      if [ "${CI_JOB_STATUS}" = "canceled" ]; then
        # release_resources does not run in a canceled pipeline, so free the
        # shared allocation here.
        ALLOC_ID="$(flux jobs --name="${ALLOC_NAME}" -n -o "{id}")"

        if [ -n "${ALLOC_ID}" ]; then
          echo "### Cancel Flux shared allocation ${ALLOC_NAME} (${ALLOC_ID})"
          flux cancel "${ALLOC_ID}" || true
        fi

        URI="$(flux jobs --name="${FLUX_JOB_NAME}" -n -o "{id}")"

        if [ -n "${URI}" ]; then
          echo "### Cancel Flux standalone job ${FLUX_JOB_NAME} (${URI})"
          flux cancel "${URI}" || true
        else
          echo "### No standalone Flux job found for ${FLUX_JOB_NAME}"
        fi
      fi

# Extends allocate_resources from the shared pipeline. It must be interruptible
# so that waiting for the allocation does not block GitLab from auto-canceling
# redundant pipelines.
allocate_resources:
  interruptible: true
  after_script:
    - !reference [.clean-flux-allocation, after_script]

.clean-slurm-allocation:
  after_script:
    - |
      if [ "${CI_JOB_STATUS}" = "canceled" ]; then
        SLURM_ID=""

        if [ -n "${SLURM_JOB_ID}" ]; then
          SLURM_ID="${SLURM_JOB_ID}"
        else
          SLURM_ID="$(squeue --noheader --name="${SLURM_JOB_NAME}" --format="%A" 2>/dev/null | head -n1)"
        fi

        if [ -n "${SLURM_ID}" ]; then
          echo "### Cancel Slurm standalone job ${SLURM_JOB_NAME} (${SLURM_ID})"
          scancel "${SLURM_ID}" || true
        else
          echo "### No standalone Slurm job found for ${SLURM_JOB_NAME}"
        fi
      fi
