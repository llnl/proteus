.base-job:
  extends: .job_on_matrix
  interruptible: true
  # Limit actual Matrix runner jobs to two global lanes across child pipelines.
  resource_group: "matrix-ci-${MATRIX_CI_LANE}"
  before_script:
    - !reference [.select-bank, before_script]
    - echo "=== Start CI spack Tests ==="
  after_script:
    - !reference [.clean-slurm-allocation, after_script]
    - !reference [.remove-builds-dir, after_script]
    - echo "=== End CI spack Tests ==="

.variants:
  parallel:
    matrix:
      - PROTEUS_CI_CUDA_VERSION: ["12.9"]
        PROTEUS_CI_LLVM_VERSION: ["19.1.3"]
        MATRIX_CI_LANE: ["0"]

test-spack-matrix:
  extends: [.base-job, .variants]
  variables:
    PROTEUS_CI_CUDA_ARCH: "90"
