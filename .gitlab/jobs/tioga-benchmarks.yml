.base-job:
  extends: .job_on_tioga
  interruptible: true
  before_script:
    - !reference [.select-bank, before_script]
    - echo "=== Start CI Benchmarking ==="
  after_script:
    - !reference [.clean-flux-allocation, after_script]
    - echo "=== End CI Benchmarking ==="

.build-variants:
  parallel:
    matrix:
      - PROTEUS_CI_ROCM_VERSION: ["6.4.3"]

proteus-benchmarks-tioga:
  extends: [.base-job, .build-variants]
  artifacts:
    paths:
      - proteus-benchmarks/results/*.csv
      - proteus-benchmarks/plots/*.png
