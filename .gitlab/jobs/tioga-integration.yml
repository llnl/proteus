.base-job:
  extends: .job_on_tioga
  interruptible: true
  before_script:
    - !reference [.select-bank, before_script]
    - echo "=== Start CI Integration Tests ==="
  after_script:
    - !reference [.clean-flux-allocation, after_script]
    - !reference [.remove-builds-dir, after_script]
    - echo "=== End CI Integration Tests ==="

.variants:
  parallel:
    matrix:
      - PROTEUS_CI_INTEGRATION_TEST:
        - cmake-shared_libs-shared_proteus
        - cmake-shared_proteus
        - cmake-shared_libs-static_proteus
        - cmake-static_proteus
        - make-static_proteus
        - make-shared_proteus
        - cmake-proteusCore
        - cmake-shared_lib_and_exe-static_proteus
        - cmake-proteusFrontend
        - cmake-clang_plugin-proteusFrontend
        - cmake-proteusFrontend-gcc
        - cmake-link_llvm-shared_proteus
        - mpi-shared-cache
        PROTEUS_CI_ROCM_VERSION: ["6.4.3", "7.1.1", "7.2.0"]

test-integration-tioga:
  extends: [.base-job, .variants]
