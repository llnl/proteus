# The template job to test whether a machine is up.
# Expects CI_MACHINE defined to machine name.
# It fails so that "Retry failed jobs" re-runs the check and then creates the
# skipped sub-pipelines with the machine's current state.
.machine-check:
  stage: prerequisites
  tags: [shell, oslic]
  variables:
    GIT_STRATEGY: none
  script:
    - |
      # Check if required variables are set for machine checking
      if [ -z "$CI_MACHINE" ]; then
        echo -e "\e[31mError: CI_MACHINE variable not set\e[0m"
        exit 1
      fi

      # Check if lorenz status file exists
      LORENZ_STATUS_FILE="/usr/global/tools/lorenz/data/loginnodeStatus"
      if [ ! -f "$LORENZ_STATUS_FILE" ]; then
        echo -e "\e[31mError: Lorenz status file not found: $LORENZ_STATUS_FILE\e[0m"
        exit 1
      fi

      echo "Checking availability of machine: ${CI_MACHINE}"

      # Query machine status with error handling
      NODES_UP=$(jq -r ".[\"${CI_MACHINE}\"].total_nodes_up // \"null\"" "$LORENZ_STATUS_FILE" 2>/dev/null)
      JQ_EXIT_CODE=$?

      if [ $JQ_EXIT_CODE -ne 0 ]; then
        echo -e "\e[31mError: Failed to parse lorenz status file\e[0m"
        echo "File content sample:"
        head -n 5 "$LORENZ_STATUS_FILE" 2>/dev/null || echo "Cannot read file"
        exit 1
      fi

      if [ "$NODES_UP" = "null" ]; then
        echo -e "\e[31mError: Machine ${CI_MACHINE} not found in status file\e[0m"
        echo "Available machines in status file:"
        jq -r 'keys[]' "$LORENZ_STATUS_FILE" 2>/dev/null | head -10 || echo "Cannot list machines"
        exit 1
      fi

      if [ "$NODES_UP" -eq 0 ]; then
        echo -e "\e[31mMachine ${CI_MACHINE} is down (${NODES_UP} nodes up)\e[0m"
        exit 1
      fi

      echo -e "\e[32m${CI_MACHINE} is available (${NODES_UP} nodes up)\e[0m"

.pipeline-trigger-rules:
  rules:
    # For default-branch push pipelines, rules:changes compares against the
    # previous commit on the branch. Non-default branches compare to main.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths: &pipeline_trigger_paths
          - ".gitlab-ci.yml"
          - ".gitlab/**/*"
          - "CMakeLists.txt"
          - "bindings/python/**/*"
          - "cmake/**/*"
          - "include/**/*"
          - "src/**/*"
          - "scripts/gitlab/**/*"
          - "tests/**/*"
          - "packaging/spack/**/*"
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: &compare_to_ref "refs/heads/main"
        paths: *pipeline_trigger_paths

.core-build-rules:
  rules:
    # For default-branch push pipelines, rules:changes compares against the
    # previous commit on the branch. Non-default branches compare to main.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths: &core_build_paths
          - ".gitlab-ci.yml"
          - ".gitlab/**/*"
          - "CMakeLists.txt"
          - "bindings/python/**/*"
          - "cmake/**/*"
          - "include/**/*"
          - "src/**/*"
          - "scripts/gitlab/**/*"
          - "tests/**/*"
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: *compare_to_ref
        paths: *core_build_paths

.spack-rules:
  rules:
    # For default-branch push pipelines, rules:changes compares against the
    # previous commit on the branch. Non-default branches compare to main.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths: &spack_paths
          - ".gitlab-ci.yml"
          - ".gitlab/**/*"
          - "CMakeLists.txt"
          - "cmake/**/*"
          - "packaging/spack/**/*"
          - "tests/**/*"
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: *compare_to_ref
        paths: *spack_paths

###
# Trigger a build-and-test pipeline for a machine.
# Comment the jobs for machines you don’t need.
###

# MATRIX
matrix-up-check:
  variables:
    CI_MACHINE: "matrix"
  extends: [.machine-check, .pipeline-trigger-rules]

matrix-build-and-test:
  variables:
    CI_MACHINE: "matrix"
    JOB_CMD:
      value: "scripts/gitlab/ci-build-test.sh"
      expand: false
  needs: [matrix-up-check]
  extends: [.build-and-test-llvm, .core-build-rules]

matrix-proteus-benchmarks:
  variables:
    CI_MACHINE: "matrix"
    JOB_CMD:
      value: "scripts/gitlab/ci-run-benchmarks.sh"
      expand: false
  needs: [matrix-up-check, matrix-build-and-test]
  extends: [.run-benchmarks, .core-build-rules]

matrix-test-spack:
  variables:
    CI_MACHINE: "matrix"
    JOB_CMD:
      value: "tests/spack/cuda/ci-test-spack.sh"
      expand: false
  needs:
    - job: matrix-up-check
    - job: matrix-build-and-test
      optional: true
  extends: [.test-spack, .spack-rules]

matrix-test-integration:
  variables:
    CI_MACHINE: "matrix"
    JOB_CMD:
      value: "tests/integration/cuda/ci-test-integration.sh"
      expand: false
  needs: [matrix-up-check, matrix-build-and-test]
  extends: [.test-integration, .core-build-rules]

